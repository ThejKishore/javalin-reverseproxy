gateway:
  port: 8080

  # Where to load routes from: "yaml" (this file)
  # or "database"
  # or "eclipse-store-lcl" (local file store for Eclipse IDE users)
  # or eclipse-store-azure (Azure Blob Storage for Eclipse IDE users)

  config-source: eclipse-store-lcl
#  config-source: database

  # How often routes are refreshed from the source (seconds)
  refresh-interval-seconds: 60

  datasource:
    type: h2
    url: "jdbc:h2:mem:gateway;DB_CLOSE_DELAY=-1;MODE=PostgreSQL"
    username: sa
    password: ""

  # ── Hazelcast — distributed CSRF token store ──────────────────────────────
  hazelcast:
    enabled: true                      # Set false to disable CSRF filter entirely
    cluster-name: gateway-cluster
    members: []                        # Empty = standalone; for K8s: ["hz-service:5701"]
    csrf-map-ttl-seconds: 3600

  # ── Global JWT policy — enforced on ALL routes unless overridden ──────────
  # A route can opt-out by adding:  jwt-policy: { enabled: false }
  # A route can use different credentials by specifying its own jwt-policy block.
  jwt-policy:
    enabled: true
    algorithm: HS256                   # HS256 | HS384 | HS512 | RS256
    # HS512 requires ≥ 64 bytes.  HS384 ≥ 48 bytes.  HS256 ≥ 32 bytes.
    secret-or-public-key: "ul3lSRmvRtn1e5wePKyHA3EpjDCP60zUsjg7ZDsaO6WXqB8mN"
    issuer: ""                         # Leave blank to skip issuer check
    audience: ""                       # Leave blank to skip audience check
    required-claims: {}                # e.g.  role: admin
    exclude-paths:                     # Paths that bypass JWT (prefix match)
      - /gateway/health
      - /gateway/admin
      - /api/example
      - /tla/api
      - /tla/weighted
      - /tla/longrun

  # ── Global CSRF policy — enforced on ALL routes unless overridden ─────────
  # A route can opt-out by adding:  csrf-policy: { enabled: false }
  csrf-policy:
    enabled: false                     # Set true to enforce CSRF globally
    token-ttl-seconds: 3600
    bind-to: IP                        # IP | SESSION
    exclude-paths:                     # Paths exempt from CSRF (prefix match)
      - /gateway/health
      - /gateway/admin

  # ── Global CSP policy — injected on ALL routes unless overridden ──────────
  # A route can opt-out by adding:  csp-policy: { enabled: false }
  csp-policy:
    enabled: false                     # Set true to inject CSP headers globally
    policy: "default-src 'self'"
    report-only: false                 # true = Content-Security-Policy-Report-Only
    exclude-paths:                     # Paths exempt from CSP injection (prefix match)
      - /gateway/health
      - /gateway/admin

  routes:
    - id: example-service
      name: Example Service
      path-pattern: /api/example
      routing-type: PATH
      strip-prefix: /api/example
      enabled: true
      timeout-ms: 5000
      load-balancer-type: ROUND_ROBIN
      targets:
        - url: https://jsonplaceholder.typicode.com
          weight: 1
      rate-limit-policy:
        enabled: false
        requests-per-second: 100
        burst: 20
        timeout-duration-ms: 0
      circuit-breaker-policy:
        enabled: false
        failure-rate-threshold: 50
        wait-duration-seconds: 60
        sliding-window-size: 10
      cache-policy:
        enabled: false
        ttl-seconds: 300
        cache-key-strategy: METHOD_PATH_QUERY
      header-rules:
        add-request:
          - name: X-Gateway
            value: "javalin-gateway"
          - name: X-Gateway-Version
            value: "1.0.0"
        exclude-request:
          - Cookie
        add-response:
          - name: X-Powered-By
            value: "javalin-gateway"
        exclude-response:
          - Server
        dedupe-response-headers:
          - Access-Control-Allow-Origin
      auth-forward-headers:
        - Authorization
        - X-API-Key
      audit-enabled: false
      audit-store: database

      # ── Security filters (all optional, per-route) ───────────────────────
      # All three policies (JWT, CSRF, CSP) are inherited from the global blocks above.
      # To disable a policy for this route only:
      #   jwt-policy:  { enabled: false }
      #   csrf-policy: { enabled: false }
      #   csp-policy:  { enabled: false }
      # To use route-specific settings, specify the full policy block here.

      # HTTP Input Validation — blacklist ESAPI patterns (loaded from DB)
      http-validation-policy:
        enabled: false
        validate-query-params: true
        validate-headers: true
        validate-cookies: true
        validate-body: false           # Reads body into memory — disable for large uploads
        exclude-paths: []

    # ── Example: Load-balanced backend with circuit breaker ─────────────────
    - id: backend-lb
      name: Load-Balanced Backend
      path-pattern: /api/backend
      routing-type: PATH
      strip-prefix: /api/backend
      enabled: false
      timeout-ms: 3000
      load-balancer-type: ROUND_ROBIN
      targets:
        - url: http://backend-1:8080
          weight: 2
        - url: http://backend-2:8080
          weight: 1
      circuit-breaker-policy:
        enabled: true
        failure-rate-threshold: 50
        wait-duration-seconds: 30
        sliding-window-size: 10
      rate-limit-policy:
        enabled: true
        requests-per-second: 200
        burst: 50
      audit-enabled: true
      audit-store: database

    # ── Example: Header-based routing ───────────────────────────────────────
    - id: canary-service
      name: Canary Service
      path-pattern: /api/canary
      routing-type: HEADER
      header-match-name: X-Canary
      header-match-value: "true"
      enabled: false
      timeout-ms: 5000
      load-balancer-type: RANDOM
      targets:
        - url: http://canary-service:8080
          weight: 1

    # ── Example: Traffic splitting ───────────────────────────────────────────
    - id: traffic-split
      name: Traffic Split (90/10)
      path-pattern: /api/split
      routing-type: TRAFFIC_SPLIT
      enabled: false
      timeout-ms: 5000
      load-balancer-type: WEIGHTED
      targets:
        - url: http://stable-service:8080
          weight: 9
        - url: http://beta-service:8080
          weight: 1

    # ── Example: Regex routing ───────────────────────────────────────────────
    - id: regex-route
      name: Regex Route
      path-pattern: "/api/v[0-9]+/.*"
      routing-type: REGEX
      enabled: false
      timeout-ms: 5000
      load-balancer-type: ROUND_ROBIN
      targets:
        - url: http://versioned-service:8080
          weight: 1
      cache-policy:
        enabled: true
        ttl-seconds: 60
        cache-key-strategy: METHOD_PATH_QUERY

