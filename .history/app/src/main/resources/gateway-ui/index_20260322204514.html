<!DOCTYPE html>

  Context path: /gateway/admin/ui  |  App logic: /gateway-ui/app.js

<html lang="en" class="app-dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gateway Admin</title>
  <!-- Icons & Flex utilities -->
  <link rel="stylesheet" href="https://unpkg.com/primeicons/primeicons.css">
  <link rel="stylesheet" href="https://unpkg.com/primeflex@3/primeflex.min.css">
  <style>
    /* ─── Forced dark baseline — fallback when @primeuix/themes CDN is unreachable ─── */
    :root {
      --p-primary-color: #38bdf8;
      --p-primary-contrast-color: #0c2d48;
      --p-surface-0: #ffffff;
      --p-surface-900: #1e293b;
      --p-surface-950: #0f1117;
      --p-text-color: #e2e8f0;
      --p-text-muted-color: #94a3b8;
      --p-border-color: #1f2937;
      --p-content-border-radius: 8px;
    }
    * { box-sizing: border-box; }
    html.app-dark body {
      background: #0f1117;
      color: #e2e8f0;
      margin: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    #app { min-height: 100vh; }

    /* ── Layout ── */
    .shell          { max-width: 1280px; margin: 0 auto; padding: 0 1.5rem 2.5rem; }
    .app-header     { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: .85rem 1.5rem; position: sticky; top: 0; z-index: 20; background: #0f1117; border-bottom: 1px solid #1e293b; }
    .brand          { display: flex; align-items: center; gap: .6rem; font-weight: 700; font-size: 1.05rem; }
    .brand-sub      { color: #94a3b8; font-size: .82rem; font-weight: 400; }
    .header-right   { display: flex; align-items: center; gap: .4rem; }
    .stats          { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: .75rem; margin: 1rem 0; }
    .stat-card      { background: #111827; border: 1px solid #1e293b; border-radius: 8px; padding: .85rem 1rem; }
    .stat-value     { font-size: 1.75rem; font-weight: 700; line-height: 1.1; }
    .stat-label     { color: #94a3b8; font-size: .7rem; text-transform: uppercase; letter-spacing: .06em; margin-top: .2rem; }
    .path-mono      { font-family: ui-monospace, Menlo, Consolas, monospace; background: #0b1222; padding: .18rem .45rem; border-radius: 4px; color: #7dd3fc; font-size: .83rem; white-space: nowrap; }
    .targets-text   { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .83rem; color: #cbd5e1; }
    .empty-hint     { text-align: center; padding: 3rem 1rem; color: #94a3b8; }
    .empty-hint i   { font-size: 2.5rem; margin-bottom: .65rem; display: block; }

    /* ── Forms ── */
    .form-2col      { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1rem; }
    .form-3col      { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 1rem; }
    .f-label        { display: block; font-size: .77rem; font-weight: 600; color: #94a3b8; margin-bottom: .28rem; letter-spacing: .02em; }
    .toggle-row     { display: flex; align-items: center; gap: .55rem; }
    .chip           { display: inline-flex; align-items: center; gap: .25rem; padding: .2rem .5rem; border: 1px solid #1e293b; background: #0b1222; border-radius: 999px; font-size: .8rem; margin: .15rem; }
    .chip i         { cursor: pointer; font-size: .65rem; opacity: .7; }
    .chip i:hover   { opacity: 1; }
    .target-grid    { display: grid; grid-template-columns: 1fr 100px auto; align-items: end; gap: .5rem; background: #0b1222; border: 1px solid #1e293b; border-radius: 8px; padding: .7rem; margin-bottom: .5rem; }
    .hdr-pair-row   { display: grid; grid-template-columns: 1fr 1fr auto; align-items: end; gap: .45rem; margin-bottom: .4rem; }
    .inline-flex    { display: inline-flex; align-items: center; gap: .45rem; }
    .w-full         { width: 100%; }
    .mb-sm          { margin-bottom: .5rem; }
    .mt-sm          { margin-top: .5rem; }
    .section-gap    { margin-bottom: 1.25rem; }

    /* ── PrimeVue dark overrides (used when Aura CDN is unavailable) ── */
    html.app-dark .p-datatable                       { background: #111827; color: #e2e8f0; border-radius: 8px; overflow: hidden; }
    html.app-dark .p-datatable-header                { background: #111827; border-bottom: 1px solid #1e293b; }
    html.app-dark .p-datatable-thead > tr > th       { background: #0b1222; color: #94a3b8; border-color: #1e293b; padding: .65rem 1rem; }
    html.app-dark .p-datatable-tbody > tr > td       { background: #111827; border-color: #1e293b; color: #e2e8f0; padding: .6rem 1rem; }
    html.app-dark .p-datatable-tbody > tr:hover > td { background: #1e293b; }
    html.app-dark .p-paginator                       { background: #0b1222; border-top: 1px solid #1e293b; }
    html.app-dark .p-paginator-page,
    html.app-dark .p-paginator-prev,
    html.app-dark .p-paginator-next                  { color: #94a3b8; }
    html.app-dark .p-paginator-page.p-highlight      { background: #1e40af; color: #fff; }
    html.app-dark .p-toolbar                         { background: #111827; border: 1px solid #1e293b; border-radius: 8px; padding: .6rem 1rem; }
    html.app-dark .p-dialog                          { background: #111827; border: 1px solid #1e293b; border-radius: 12px; }
    html.app-dark .p-dialog-header                   { background: #0b1222; border-bottom: 1px solid #1e293b; color: #e2e8f0; padding: 1rem 1.25rem; border-radius: 12px 12px 0 0; }
    html.app-dark .p-dialog-footer                   { border-top: 1px solid #1e293b; padding: .75rem 1.25rem; background: #0b1222; border-radius: 0 0 12px 12px; }
    html.app-dark .p-dialog-content                  { background: #111827; padding: 1.25rem; }
    html.app-dark .p-tabview-nav                     { background: #0b1222; border-color: #1e293b; }
    html.app-dark .p-tabview-nav-link                { color: #94a3b8 !important; border-color: transparent !important; }
    html.app-dark .p-tabview-nav-link.p-highlight    { color: #38bdf8 !important; border-color: #38bdf8 !important; }
    html.app-dark .p-tabview-panels                  { background: transparent; padding: 1rem 0 0; }
    html.app-dark .p-inputtext,
    html.app-dark .p-inputnumber-input               { background: #0b1222; color: #e2e8f0; border-color: #334155; border-radius: 6px; padding: .45rem .7rem; }
    html.app-dark .p-inputtext:focus,
    html.app-dark .p-inputnumber-input:focus         { border-color: #38bdf8; box-shadow: 0 0 0 2px rgba(56,189,248,.2); outline: none; }
    html.app-dark .p-dropdown,
    html.app-dark .p-select                          { background: #0b1222; border-color: #334155; border-radius: 6px; }
    html.app-dark .p-dropdown-label,
    html.app-dark .p-select-label                    { color: #e2e8f0; }
    html.app-dark .p-dropdown-panel,
    html.app-dark .p-select-overlay                  { background: #0b1222; border-color: #1e293b; border-radius: 8px; }
    html.app-dark .p-dropdown-item,
    html.app-dark .p-select-option                   { color: #e2e8f0; padding: .45rem .75rem; }
    html.app-dark .p-dropdown-item:hover,
    html.app-dark .p-select-option:hover             { background: #1e293b; }
    html.app-dark .p-button                          { border-radius: 6px; }
    html.app-dark .p-button.p-button-text            { color: #94a3b8; background: transparent; border: none; }
    html.app-dark .p-button.p-button-text:hover      { color: #e2e8f0; background: #1e293b; }
    html.app-dark .p-button.p-button-secondary       { background: #1e293b; border-color: #334155; color: #e2e8f0; }
    html.app-dark .p-divider-horizontal::before      { border-top: 1px solid #1e293b; }
    html.app-dark .p-toast .p-toast-message          { background: #1e293b; border: 1px solid #334155; border-radius: 8px; color: #e2e8f0; }
    html.app-dark .p-confirm-dialog .p-dialog-content { background: #111827; color: #e2e8f0; }
    html.app-dark .p-inputswitch.p-highlight .p-inputswitch-slider,
    html.app-dark .p-toggleswitch.p-highlight .p-toggleswitch-slider { background: #38bdf8; }
  </style>
</head>
<body>
<div id="app">
  <div class="shell">
    <div class="header">
      <div class="brand"><i class="pi pi-server"></i> Gateway Admin <span class="muted">Route dashboard</span></div>
      <div class="inline">
        <Tag :value="healthLabel" :severity="healthSeverity" />
        <Button icon="pi pi-refresh" class="p-button-text" @click="loadAll" />
      </div>
    </div>

    <div class="stats">
      <div class="stat"><div class="value">{{ routes.length }}</div><div class="label">Total Routes</div></div>
      <div class="stat"><div class="value" style="color:#4ade80">{{ activeCount }}</div><div class="label">Active</div></div>
      <div class="stat"><div class="value" style="color:#fca5a5">{{ disabledCount }}</div><div class="label">Disabled</div></div>
      <div class="stat"><div class="value" :style="{color: healthLabel==='UP' ? '#4ade80' : '#fca5a5'}">{{ healthLabel }}</div><div class="label">Health</div></div>
    </div>

    <Toolbar class="toolbar-gap">
      <template #start>
        <Button label="New Route" icon="pi pi-plus" class="mr-2" @click="openCreate" />
        <Button label="Reload Gateway" icon="pi pi-sync" class="p-button-secondary" @click="reloadGateway" />
      </template>
      <template #end>
        <span class="p-input-icon-left search">
          <i class="pi pi-search"></i>
          <InputText v-model="search" placeholder="Search routes..." class="w-full" />
        </span>
      </template>
    </Toolbar>

    <DataTable :value="filteredRoutes" :loading="loading" paginator :rows="10" :rowsPerPageOptions="[10,20,50]" responsiveLayout="scroll">
      <template #empty>
        <div class="empty-state"><i class="pi pi-inbox" style="font-size:2rem"></i><div>No routes yet. Click “New Route”.</div></div>
      </template>

      <Column field="name" header="Name" sortable></Column>
      <Column header="Path" sortable :sortField="'path-pattern'">
        <template #body="{ data }"><span class="path-code">{{ data['path-pattern'] }}</span></template>
      </Column>
      <Column header="Type">
        <template #body="{ data }"><Tag :value="data['routing-type']" :severity="typeSeverity(data['routing-type'])" /></template>
      </Column>
      <Column header="Targets">
        <template #body="{ data }"><span class="targets">{{ fmtTargets(data.targets) }}</span></template>
      </Column>
      <Column header="LB">
        <template #body="{ data }">{{ data['load-balancer-type'] || '—' }}</template>
      </Column>
      <Column header="Status">
        <template #body="{ data }"><Tag :value="data.enabled ? 'ENABLED' : 'DISABLED'" :severity="data.enabled ? 'success' : 'danger'" /></template>
      </Column>
      <Column header="Actions" style="width:160px">
        <template #body="{ data }">
          <Button icon="pi pi-pencil" class="p-button-text" @click="openEdit(data)" />
          <Button :icon="data.enabled ? 'pi pi-pause' : 'pi pi-play'" class="p-button-text" :severity="data.enabled ? 'warning' : 'success'" @click="toggleRoute(data)" />
          <Button icon="pi pi-trash" class="p-button-text p-button-danger" @click="confirmDelete(data)" />
        </template>
      </Column>
    </DataTable>

    <Dialog v-model:visible="dlgVisible" :header="dlgMode==='create' ? 'New Route' : 'Edit Route — ' + form.name" :modal="true" :draggable="false" :style="{width:'900px'}">
      <TabView v-model:activeIndex="activeTab">
        <TabPanel header="Basic">
          <div class="form-grid-2">
            <div>
              <label class="field-label">Name *</label>
              <InputText v-model="form.name" placeholder="users-service" class="w-full" />
            </div>
            <div>
              <label class="field-label">Path Pattern *</label>
              <InputText v-model="form['path-pattern']" placeholder="/api/users" class="w-full" />
            </div>
            <div>
              <label class="field-label">Routing Type</label>
              <Dropdown v-model="form['routing-type']" :options="rtOpts" optionLabel="label" optionValue="value" class="w-full" />
            </div>
            <div>
              <label class="field-label">Load Balancer</label>
              <Dropdown v-model="form['load-balancer-type']" :options="lbOpts" optionLabel="label" optionValue="value" class="w-full" />
            </div>
            <div>
              <label class="field-label">Strip Prefix</label>
              <InputText v-model="form['strip-prefix']" placeholder="/api/v1" class="w-full" />
            </div>
            <div>
              <label class="field-label">Timeout (ms)</label>
              <InputNumber v-model="form['timeout-ms']" :min="100" :max="300000" class="w-full" />
            </div>
          </div>
          <div class="form-grid-2" v-if="form['routing-type']==='HEADER'">
            <div>
              <label class="field-label">Header Match Name</label>
              <InputText v-model="form['header-match-name']" class="w-full" />
            </div>
            <div>
              <label class="field-label">Header Match Value</label>
              <InputText v-model="form['header-match-value']" class="w-full" />
            </div>
          </div>
          <div class="inline" style="margin-top:.75rem">
            <span class="field-label" style="margin:0">Enabled</span>
            <InputSwitch v-model="form.enabled" />
          </div>
        </TabPanel>

        <TabPanel header="Targets">
          <div class="targets-wrap">
            <Button label="Add Target" icon="pi pi-plus" class="p-button-text" @click="addTarget" />
            <div v-if="form.targets.length===0" class="empty-state">No targets added yet.</div>
            <div v-for="(t,i) in form.targets" :key="i" class="target-row">
              <div>
                <label class="field-label">URL</label>
                <InputText v-model="t.url" placeholder="http://backend:8080" class="w-full" />
              </div>
              <div>
                <label class="field-label">Weight</label>
                <InputNumber v-model="t.weight" :min="1" :max="100" class="w-full" />
              </div>
              <div style="text-align:right">
                <Button icon="pi pi-times" class="p-button-text p-button-danger" @click="removeTarget(i)" />
              </div>
            </div>
          </div>
        </TabPanel>

        <TabPanel header="Policies">
          <div class="form-grid-3">
            <div>
              <div class="inline"><label class="field-label" style="margin:0">Rate Limit</label><InputSwitch v-model="form['rate-limit-policy'].enabled" /></div>
              <div v-if="form['rate-limit-policy'].enabled" class="form-grid-3" style="margin-top:.5rem">
                <InputNumber v-model="form['rate-limit-policy']['requests-per-second']" :min="1" class="w-full" placeholder="Req/s" />
                <InputNumber v-model="form['rate-limit-policy'].burst" :min="0" class="w-full" placeholder="Burst" />
                <InputNumber v-model="form['rate-limit-policy']['timeout-duration-ms']" :min="0" class="w-full" placeholder="Timeout ms" />
              </div>
            </div>
            <div>
              <div class="inline"><label class="field-label" style="margin:0">Circuit Breaker</label><InputSwitch v-model="form['circuit-breaker-policy'].enabled" /></div>
              <div v-if="form['circuit-breaker-policy'].enabled" class="form-grid-3" style="margin-top:.5rem">
                <InputNumber v-model="form['circuit-breaker-policy']['failure-rate-threshold']" :min="1" :max="100" class="w-full" placeholder="Failure %" />
                <InputNumber v-model="form['circuit-breaker-policy']['wait-duration-seconds']" :min="1" class="w-full" placeholder="Wait s" />
                <InputNumber v-model="form['circuit-breaker-policy']['sliding-window-size']" :min="1" class="w-full" placeholder="Window" />
              </div>
            </div>
            <div>
              <div class="inline"><label class="field-label" style="margin:0">Cache</label><InputSwitch v-model="form['cache-policy'].enabled" /></div>
              <div v-if="form['cache-policy'].enabled" class="form-grid-2" style="margin-top:.5rem">
                <InputNumber v-model="form['cache-policy']['ttl-seconds']" :min="1" class="w-full" placeholder="TTL s" />
                <Dropdown v-model="form['cache-policy']['cache-key-strategy']" :options="ckOpts" optionLabel="label" optionValue="value" class="w-full" />
              </div>
            </div>
            <div>
              <div class="inline"><label class="field-label" style="margin:0">Audit</label><InputSwitch v-model="form['audit-enabled']" /></div>
              <div v-if="form['audit-enabled']" style="margin-top:.5rem">
                <Dropdown v-model="form['audit-store']" :options="auditOpts" optionLabel="label" optionValue="value" class="w-full" />
              </div>
            </div>
          </div>
        </TabPanel>

        <TabPanel header="Headers">
          <div class="form-grid-2">
            <div>
              <div class="inline"><label class="field-label" style="margin:0">Add Request Header</label><Button icon="pi pi-plus" class="p-button-text" @click="addReqHdr" /></div>
              <div v-for="(e,i) in reqHdrEntries" :key="'rq'+i" class="inline" style="width:100%; margin-bottom:.35rem">
                <InputText v-model="e.key" placeholder="Header" class="w-full" />
                <InputText v-model="e.value" placeholder="Value" class="w-full" />
                <Button icon="pi pi-times" class="p-button-text p-button-danger" @click="removeReqHdr(i)" />
              </div>
            </div>
            <div>
              <div class="inline"><label class="field-label" style="margin:0">Add Response Header</label><Button icon="pi pi-plus" class="p-button-text" @click="addRespHdr" /></div>
              <div v-for="(e,i) in respHdrEntries" :key="'rs'+i" class="inline" style="width:100%; margin-bottom:.35rem">
                <InputText v-model="e.key" placeholder="Header" class="w-full" />
                <InputText v-model="e.value" placeholder="Value" class="w-full" />
                <Button icon="pi pi-times" class="p-button-text p-button-danger" @click="removeRespHdr(i)" />
              </div>
            </div>
          </div>

          <Divider />

          <div class="form-grid-2">
            <div>
              <label class="field-label">Exclude Request Headers</label>
              <div class="inline" style="width:100%; margin-bottom:.4rem">
                <InputText v-model="newExclReq" placeholder="e.g. Cookie" class="w-full" @keyup.enter="addExclReq" />
                <Button icon="pi pi-plus" class="p-button-text" @click="addExclReq" />
              </div>
              <div>
                <span v-for="(h,i) in form['header-rules']['exclude-request']" :key="'er'+i" class="chip-row">{{ h }} <Button icon="pi pi-times" class="p-button-text p-button-danger" @click="form['header-rules']['exclude-request'].splice(i,1)" /></span>
              </div>
            </div>
            <div>
              <label class="field-label">Exclude Response Headers</label>
              <div class="inline" style="width:100%; margin-bottom:.4rem">
                <InputText v-model="newExclResp" placeholder="e.g. Server" class="w-full" @keyup.enter="addExclResp" />
                <Button icon="pi pi-plus" class="p-button-text" @click="addExclResp" />
              </div>
              <div>
                <span v-for="(h,i) in form['header-rules']['exclude-response']" :key="'ers'+i" class="chip-row">{{ h }} <Button icon="pi pi-times" class="p-button-text p-button-danger" @click="form['header-rules']['exclude-response'].splice(i,1)" /></span>
              </div>
            </div>
          </div>

          <Divider />

          <div>
            <label class="field-label">Auth Forward Headers</label>
            <div class="inline" style="width:100%; margin-bottom:.4rem">
              <InputText v-model="newAuth" placeholder="e.g. Authorization" class="w-full" @keyup.enter="addAuth" />
              <Button icon="pi pi-plus" class="p-button-text" @click="addAuth" />
            </div>
            <div>
              <span v-for="(h,i) in form['auth-forward-headers']" :key="'auth'+i" class="chip-row">{{ h }} <Button icon="pi pi-times" class="p-button-text p-button-danger" @click="form['auth-forward-headers'].splice(i,1)" /></span>
            </div>
          </div>

        </TabPanel>
      </TabView>

      <template #footer>
        <Button label="Cancel" class="p-button-text" icon="pi pi-times" @click="dlgVisible=false" />
        <Button :label="dlgMode==='create' ? 'Create Route' : 'Save Changes'" :icon="dlgMode==='create' ? 'pi pi-plus' : 'pi pi-check'" :loading="saving" @click="saveRoute" />
      </template>
    </Dialog>

    <Toast position="top-right" />
    <ConfirmDialog />
  </div>
</div>

<!-- Vue + PrimeVue (CDN) -->
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="https://unpkg.com/primevue@3.53.0/core/core.min.js"></script>
<script src="https://unpkg.com/primevue@3.53.0/button/button.min.js"></script>
<script src="https://unpkg.com/primevue@3.53.0/toolbar/toolbar.min.js"></script>
<script src="https://unpkg.com/primevue@3.53.0/datatable/datatable.min.js"></script>
<script src="https://unpkg.com/primevue@3.53.0/column/column.min.js"></script>
<script src="https://unpkg.com/primevue@3.53.0/dialog/dialog.min.js"></script>
<script src="https://unpkg.com/primevue@3.53.0/tabview/tabview.min.js"></script>
<script src="https://unpkg.com/primevue@3.53.0/tabview/tabpanel.min.js"></script>
<script src="https://unpkg.com/primevue@3.53.0/inputtext/inputtext.min.js"></script>
<script src="https://unpkg.com/primevue@3.53.0/inputnumber/inputnumber.min.js"></script>
<script src="https://unpkg.com/primevue@3.53.0/dropdown/dropdown.min.js"></script>
<script src="https://unpkg.com/primevue@3.53.0/inputswitch/inputswitch.min.js"></script>
<script src="https://unpkg.com/primevue@3.53.0/tag/tag.min.js"></script>
<script src="https://unpkg.com/primevue@3.53.0/divider/divider.min.js"></script>
<script src="https://unpkg.com/primevue@3.53.0/toast/toast.min.js"></script>
<script src="https://unpkg.com/primevue@3.53.0/confirmdialog/confirmdialog.min.js"></script>
<script src="https://unpkg.com/primevue@3.53.0/confirmationservice/confirmationservice.min.js"></script>
<script src="https://unpkg.com/primevue@3.53.0/toastservice/toastservice.min.js"></script>

<script>
  // Helper to get PrimeVue export from the global UMD bundle
  const pv = (name) => {
    if (!window.primevue || !window.primevue[name]) {
      console.error('PrimeVue not loaded');
      return null;
    }
    return window.primevue[name].default || window.primevue[name];
  };

  function emptyForm() {
    return {
      id: null,
      name: '',
      'path-pattern': '',
      'routing-type': 'PATH',
      'strip-prefix': '',
      enabled: true,
      'timeout-ms': 5000,
      'load-balancer-type': 'ROUND_ROBIN',
      targets: [{ url: '', weight: 1 }],
      'rate-limit-policy': { enabled: false, 'requests-per-second': 100, burst: 20, 'timeout-duration-ms': 0 },
      'circuit-breaker-policy': { enabled: false, 'failure-rate-threshold': 50, 'wait-duration-seconds': 60, 'sliding-window-size': 10 },
      'cache-policy': { enabled: false, 'ttl-seconds': 300, 'cache-key-strategy': 'METHOD_PATH_QUERY' },
      'header-rules': { 'add-request': {}, 'exclude-request': [], 'add-response': {}, 'exclude-response': [], 'dedupe-response-headers': [] },
      'auth-forward-headers': [],
      'audit-enabled': false,
      'audit-store': 'database',
      'header-match-name': '',
      'header-match-value': ''
    };
  }

  function routeToForm(r) {
    const base = emptyForm();
    const merged = Object.assign(base, JSON.parse(JSON.stringify(r)));
    merged['rate-limit-policy']      = Object.assign(base['rate-limit-policy'], r['rate-limit-policy'] || {});
    merged['circuit-breaker-policy'] = Object.assign(base['circuit-breaker-policy'], r['circuit-breaker-policy'] || {});
    merged['cache-policy']           = Object.assign(base['cache-policy'], r['cache-policy'] || {});
    merged['header-rules']           = Object.assign(base['header-rules'], r['header-rules'] || {});
    merged['auth-forward-headers']   = Array.isArray(r['auth-forward-headers']) ? [...r['auth-forward-headers']] : [];
    merged.targets                   = Array.isArray(r.targets) && r.targets.length ? JSON.parse(JSON.stringify(r.targets)) : [{ url: '', weight: 1 }];
    return merged;
  }

  const app = Vue.createApp({
    data() {
      return {
        routes: [],
        health: null,
        loading: false,
        search: '',
        dlgVisible: false,
        dlgMode: 'create',
        saving: false,
        activeTab: 0,
        form: emptyForm(),
        reqHdrEntries: [],
        respHdrEntries: [],
        newExclReq: '',
        newExclResp: '',
        newAuth: '',
        rtOpts: [
          { label: 'PATH', value: 'PATH' },
          { label: 'REGEX', value: 'REGEX' },
          { label: 'HEADER', value: 'HEADER' },
          { label: 'TRAFFIC_SPLIT', value: 'TRAFFIC_SPLIT' }
        ],
        lbOpts: [
          { label: 'Round Robin', value: 'ROUND_ROBIN' },
          { label: 'Weighted', value: 'WEIGHTED' },
          { label: 'Random', value: 'RANDOM' }
        ],
        ckOpts: [
          { label: 'METHOD + PATH', value: 'METHOD_PATH' },
          { label: 'METHOD + PATH + QUERY', value: 'METHOD_PATH_QUERY' }
        ],
        auditOpts: [
          { label: 'Database', value: 'database' },
          { label: 'File', value: 'file' }
        ]
      };
    },
    computed: {
      filteredRoutes() {
        if (!this.search) return this.routes;
        const q = this.search.toLowerCase();
        return this.routes.filter(r => (r.name || '').toLowerCase().includes(q) || (r['path-pattern'] || '').toLowerCase().includes(q) || (r['routing-type'] || '').toLowerCase().includes(q));
      },
      activeCount() { return this.routes.filter(r => r.enabled).length; },
      disabledCount() { return this.routes.filter(r => !r.enabled).length; },
      healthLabel() { return this.health ? this.health.status : 'UNKNOWN'; },
      healthSeverity() { return this.health && this.health.status === 'UP' ? 'success' : 'danger'; }
    },
    methods: {
      async loadAll() { await Promise.all([this.loadRoutes(), this.loadHealth()]); },
      async loadRoutes() {
        this.loading = true;
        try {
          const r = await fetch('/gateway/admin/routes');
          if (!r.ok) throw new Error('HTTP ' + r.status);
          this.routes = await r.json();
        } catch (e) {
          this.toast('error', 'Load failed', e.message || 'Unable to fetch routes');
        } finally {
          this.loading = false;
        }
      },
      async loadHealth() {
        try {
          const r = await fetch('/gateway/health');
          this.health = r.ok ? await r.json() : null;
        } catch { this.health = null; }
      },
      async reloadGateway() {
        try {
          const r = await fetch('/gateway/admin/reload', { method: 'POST' });
          const data = await r.json();
          this.toast('success', 'Reloaded', `${data.routes || 0} routes active`);
          await this.loadRoutes();
        } catch (e) { this.toast('error', 'Reload failed', e.message); }
      },
      openCreate() {
        this.dlgMode = 'create';
        this.form = emptyForm();
        this.syncToHelpers();
        this.activeTab = 0;
        this.dlgVisible = true;
      },
      openEdit(route) {
        this.dlgMode = 'edit';
        this.form = routeToForm(route);
        this.syncToHelpers();
        this.activeTab = 0;
        this.dlgVisible = true;
      },
      syncToHelpers() {
        const hr = this.form['header-rules'];
        this.reqHdrEntries = Object.entries(hr['add-request'] || {}).map(([k, v]) => ({ key: k, value: v }));
        this.respHdrEntries = Object.entries(hr['add-response'] || {}).map(([k, v]) => ({ key: k, value: v }));
      },
      syncFromHelpers() {
        this.form['header-rules']['add-request'] = Object.fromEntries(this.reqHdrEntries.filter(e => e.key).map(e => [e.key, e.value]));
        this.form['header-rules']['add-response'] = Object.fromEntries(this.respHdrEntries.filter(e => e.key).map(e => [e.key, e.value]));
      },
      async saveRoute() {
        if (!this.form.name || !this.form['path-pattern']) {
          this.toast('warn', 'Validation', 'Name and path-pattern are required');
          this.activeTab = 0;
          return;
        }
        if (!this.form.targets.length || !this.form.targets[0].url) {
          this.toast('warn', 'Validation', 'Add at least one target URL');
          this.activeTab = 1;
          return;
        }
        this.syncFromHelpers();
        const body = JSON.stringify(this.form);
        this.saving = true;
        try {
          const url = this.dlgMode === 'create' ? '/gateway/admin/routes' : `/gateway/admin/routes/${this.form.id}`;
          const method = this.dlgMode === 'create' ? 'POST' : 'PUT';
          const resp = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body });
          if (!resp.ok) throw new Error(await resp.text());
          this.toast('success', 'Saved', this.dlgMode === 'create' ? 'Route created' : 'Route updated');
          this.dlgVisible = false;
          await this.loadRoutes();
        } catch (e) { this.toast('error', 'Save failed', e.message || 'Unknown error'); }
        finally { this.saving = false; }
      },
      async toggleRoute(route) {
        const action = route.enabled ? 'disable' : 'enable';
        try {
          const resp = await fetch(`/gateway/admin/routes/${route.id}/${action}`, { method: 'PATCH' });
          if (!resp.ok) throw new Error('HTTP ' + resp.status);
          this.toast('success', 'Updated', `Route ${action}d`);
          await this.loadRoutes();
        } catch (e) { this.toast('error', 'Toggle failed', e.message || 'Unknown error'); }
      },
      confirmDelete(route) {
        this.$confirm.require({
          message: `Delete route "${route.name}"?`,
          header: 'Confirm Delete',
          icon: 'pi pi-exclamation-triangle',
          acceptLabel: 'Delete',
          rejectLabel: 'Cancel',
          acceptClass: 'p-button-danger',
          accept: () => this.deleteRoute(route.id)
        });
      },
      async deleteRoute(id) {
        try {
          const resp = await fetch(`/gateway/admin/routes/${id}`, { method: 'DELETE' });
          if (!resp.ok && resp.status !== 204) throw new Error('HTTP ' + resp.status);
          this.toast('success', 'Deleted', 'Route removed');
          await this.loadRoutes();
        } catch (e) { this.toast('error', 'Delete failed', e.message || 'Unknown error'); }
      },
      addTarget() { this.form.targets.push({ url: '', weight: 1 }); },
      removeTarget(i) { this.form.targets.splice(i, 1); },
      addReqHdr() { this.reqHdrEntries.push({ key: '', value: '' }); },
      removeReqHdr(i) { this.reqHdrEntries.splice(i, 1); },
      addRespHdr() { this.respHdrEntries.push({ key: '', value: '' }); },
      removeRespHdr(i) { this.respHdrEntries.splice(i, 1); },
      addExclReq() { if (this.newExclReq) { this.form['header-rules']['exclude-request'].push(this.newExclReq); this.newExclReq = ''; } },
      addExclResp() { if (this.newExclResp) { this.form['header-rules']['exclude-response'].push(this.newExclResp); this.newExclResp = ''; } },
      addAuth() { if (this.newAuth) { this.form['auth-forward-headers'].push(this.newAuth); this.newAuth = ''; } },
      typeSeverity(t) { return { PATH: 'info', REGEX: 'warning', HEADER: 'secondary', TRAFFIC_SPLIT: 'contrast' }[t] || 'info'; },
      fmtTargets(targets) {
        if (!targets || !targets.length) return '—';
        const urls = targets.map(t => t.url || '').filter(Boolean);
        return urls.slice(0, 2).join(', ') + (urls.length > 2 ? ` (+${urls.length - 2})` : '');
      },
      toast(severity, summary, detail) { this.$toast.add({ severity, summary, detail, life: severity === 'error' ? 6000 : 3000 }); }
    },
    mounted() { this.loadAll(); }
  });

  const primevuePlugin = (window.PrimeVue && (window.PrimeVue.default || window.PrimeVue)) || pv('config');
  if (primevuePlugin) app.use(primevuePlugin);
  if (pv('toastservice')) app.use(pv('toastservice'));
  if (pv('confirmationservice')) app.use(pv('confirmationservice'));

  app.component('Button', pv('button'));
  app.component('Toolbar', pv('toolbar'));
  app.component('DataTable', pv('datatable'));
  app.component('Column', pv('column'));
  app.component('Dialog', pv('dialog'));
  app.component('TabView', pv('tabview'));
  app.component('TabPanel', pv('tabpanel'));
  app.component('InputText', pv('inputtext'));
  app.component('InputNumber', pv('inputnumber'));
  app.component('Dropdown', pv('dropdown'));
  app.component('InputSwitch', pv('inputswitch'));
  app.component('Tag', pv('tag'));
  app.component('Divider', pv('divider'));
  app.component('Toast', pv('toast'));
  app.component('ConfirmDialog', pv('confirmdialog'));

  app.mount('#app');
</script>
</body>
</html>
